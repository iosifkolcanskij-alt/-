  <!-- AUTH MODAL -->
  <div id="authModal" class="auth-modal-overlay" style="display:none" role="dialog" aria-modal="true" aria-labelledby="authModalTitle">
    <div class="auth-modal-inner">
      <button type="button" class="auth-modal-close" onclick="hideAuthModal()" aria-label="Закрыть">✕</button>
      <div class="auth-modal-head">
        <div class="auth-modal-logo">✦</div>
        <h2 id="authModalTitle" class="auth-modal-title">Вход в аккаунт</h2>
        <p class="auth-modal-sub">Синхронизация истории тестов между устройствами</p>
      </div>
      <div class="auth-tabs" id="authTabs">
        <button type="button" class="auth-tab active" data-tab="login" onclick="switchAuthTab('login')">Вход</button>
        <button type="button" class="auth-tab" data-tab="register" onclick="switchAuthTab('register')">Регистрация</button>
      </div>
      <p id="authError" class="auth-error" role="alert"></p>
      <p id="authSuccess" class="auth-success" role="status"></p>
      <form id="loginForm" class="auth-form" onsubmit="event.preventDefault();submitLogin()">
        <label class="field-label" for="loginEmail">Email</label>
        <input type="email" id="loginEmail" class="input-field auth-input" placeholder="you@example.com" autocomplete="email" required />
        <label class="field-label" for="loginPassword">Пароль</label>
        <input type="password" id="loginPassword" class="input-field auth-input" autocomplete="current-password" required />
        <button type="submit" class="btn btn-primary auth-submit">Войти</button>
        <button type="button" class="auth-link-btn" onclick="switchAuthTab('forgot')">Забыли пароль?</button>
      </form>
      <form id="registerForm" class="auth-form" style="display:none" onsubmit="event.preventDefault();submitRegister()">
        <label class="field-label" for="regUsername">Логин</label>
        <input type="text" id="regUsername" class="input-field auth-input" pattern="[a-zA-Z0-9_]{3,30}" autocomplete="username" required />
        <label class="field-label" for="regName">Имя</label>
        <input type="text" id="regName" class="input-field auth-input" autocomplete="name" />
        <label class="field-label" for="regEmail">Email</label>
        <input type="email" id="regEmail" class="input-field auth-input" autocomplete="email" required />
        <label class="field-label" for="regPassword">Пароль (от 8 символов)</label>
        <input type="password" id="regPassword" class="input-field auth-input" minlength="8" autocomplete="new-password" required />
        <button type="submit" class="btn btn-primary auth-submit">Зарегистрироваться</button>
        <p class="auth-hint">На почту придёт ссылка для подтверждения</p>
      </form>
      <div id="verifyPendingForm" class="auth-form auth-form-center" style="display:none">
        <div class="auth-pending-icon">📧</div>
        <p class="auth-pending-text">Письмо на <strong id="verifyPendingEmail"></strong>. Перейдите по ссылке, затем войдите.</p>
        <button type="button" class="btn btn-secondary auth-submit" onclick="submitResendVerification()">Отправить снова</button>
        <button type="button" class="auth-link-btn" onclick="switchAuthTab('login')">Уже подтвердил — войти</button>
      </div>
      <form id="forgotForm" class="auth-form" style="display:none" onsubmit="event.preventDefault();submitForgotPassword()">
        <p class="auth-hint" style="margin-bottom:12px">Введите email для сброса пароля</p>
        <label class="field-label" for="forgotEmail">Email</label>
        <input type="email" id="forgotEmail" class="input-field auth-input" required />
        <button type="submit" class="btn btn-primary auth-submit">Отправить</button>
        <button type="button" class="auth-link-btn" onclick="switchAuthTab('login')">← Назад</button>
      </form>
      <form id="resetForm" class="auth-form" style="display:none" onsubmit="event.preventDefault();submitResetPassword()">
        <input type="hidden" id="resetToken" />
        <label class="field-label" for="resetPassword">Новый пароль</label>
        <input type="password" id="resetPassword" class="input-field auth-input" minlength="8" required />
        <label class="field-label" for="resetPassword2">Повторите</label>
        <input type="password" id="resetPassword2" class="input-field auth-input" minlength="8" required />
        <button type="submit" class="btn btn-primary auth-submit">Сохранить пароль</button>
      </form>
      <div class="auth-divider"><span>или</span></div>
      <button type="button" class="auth-google-btn" onclick="loginWithGoogle()">
        <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.7 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 12.95 4 4 12.95 4 24s8.95 20 20 20 20-8.95 20-20c0-1.3-.1-2.7-.4-3.5z"/><path fill="#FF3D00" d="M6.3 14.7l6.6 4.8C14.5 16.1 18.9 13 24 13c3.1 0 5.9 1.2 8 3.1l5.7-5.7C34.5 6.1 29.5 4 24 4 16.3 4 9.5 8.5 6.3 14.7z"/><path fill="#4CAF50" d="M24 44c5.2 0 10-2 13.6-5.2l-6.3-5.2C29.3 36 24.9 38 24 38c-5.3 0-9.8-3.4-11.4-8.1l-6.5 5C9.5 39.5 16.3 44 24 44z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-1.1 3.2-3.3 5.9-6.2 7.7l6.3 5.2C39.5 39.5 44 34.5 44 24c0-1.3-.1-2.7-.4-3.5z"/></svg>
        Войти через Google
      </button>
    </div>
  </div>
